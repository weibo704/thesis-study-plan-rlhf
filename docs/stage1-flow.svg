<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Helvetica Neue,Helvetica,Arial,sans-serif">
<rect width="1400" height="820" fill="#ffffff"/>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5A6572"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3A4A9F"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#B06A00"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#0D6158"/></marker>
</defs>
<text x="40" y="38" font-size="19" font-weight="700" fill="#1A1F26">How a user query becomes a study plan, and how feedback changes the next one</text>
<text x="40" y="62" font-size="12.5" fill="#5A6572">Two agents cooperate: one <tspan font-weight="600">writes</tspan> the candidate plans, the other <tspan font-weight="600">decides</tspan> which feedback is worth learning from.</text>
<rect x="40" y="90" width="1320" height="170" rx="9" fill="none" stroke="#7D8B99" stroke-width="1.2" stroke-dasharray="7 5" opacity="0.8"/>
<text x="54" y="109" font-size="11" font-weight="600" fill="#7D8B99" letter-spacing="0.4">PER QUERY  —  runs every time the learner asks for a plan</text>
<rect x="70" y="135" width="140" height="80" rx="7" fill="#F5F7F9" stroke="#7D8B99" stroke-width="1.4"/>
<text x="140.0" y="163.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1A1F26">User query</text>
<text x="140.0" y="182.0" text-anchor="middle" font-size="11" fill="#45505C">goal, level,</text>
<text x="140.0" y="197.0" text-anchor="middle" font-size="11" fill="#45505C">hours per week</text>
<rect x="260" y="135" width="150" height="80" rx="7" fill="#E3F1EF" stroke="#0D6158" stroke-width="1.4"/>
<text x="335.0" y="163.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1A1F26">Retrieval</text>
<text x="335.0" y="182.0" text-anchor="middle" font-size="11" fill="#45505C">embed query, take</text>
<text x="335.0" y="197.0" text-anchor="middle" font-size="11" fill="#45505C">top 25 of 1,899</text>
<rect x="460" y="128" width="180" height="94" rx="7" fill="#FDF3E2" stroke="#B06A00" stroke-width="2"/>
<text x="550.0" y="155.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">Plan Generator Agent</text>
<text x="550.0" y="174.5" text-anchor="middle" font-size="11" fill="#45505C">writes 6 distinct plans</text>
<text x="550.0" y="189.5" text-anchor="middle" font-size="11" fill="#45505C">5 courses each, ordered</text>
<text x="550.0" y="204.5" text-anchor="middle" font-size="11" fill="#45505C">temperature 0.4</text>
<rect x="690" y="128" width="170" height="94" rx="7" fill="#E9ECFA" stroke="#3A4A9F" stroke-width="2"/>
<text x="775.0" y="155.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">Reward Model</text>
<text x="775.0" y="174.5" text-anchor="middle" font-size="11" fill="#45505C">scores all 6</text>
<text x="775.0" y="189.5" text-anchor="middle" font-size="11" fill="#45505C">learned from feedback</text>
<text x="775.0" y="204.5" text-anchor="middle" font-size="11" fill="#45505C">6 plan features</text>
<rect x="910" y="135" width="160" height="80" rx="7" fill="#F5F7F9" stroke="#7D8B99" stroke-width="1.4"/>
<text x="990.0" y="163.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1A1F26">Best-of-N</text>
<text x="990.0" y="182.0" text-anchor="middle" font-size="11" fill="#45505C">pick top score, or sample</text>
<text x="990.0" y="197.0" text-anchor="middle" font-size="11" fill="#45505C">to keep propensities usable</text>
<rect x="1130" y="135" width="150" height="80" rx="7" fill="#E3F1EF" stroke="#0D6158" stroke-width="1.4"/>
<text x="1205.0" y="170.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">Study plan shown</text>
<text x="1205.0" y="189.5" text-anchor="middle" font-size="11" fill="#45505C">ordered course list</text>
<rect x="40" y="300" width="1320" height="300" rx="9" fill="none" stroke="#B06A00" stroke-width="1.2" stroke-dasharray="7 5" opacity="0.8"/>
<text x="54" y="319" font-size="11" font-weight="600" fill="#B06A00" letter-spacing="0.4">FEEDBACK LOOP  —  what the learner says changes the SCORER, not the generator</text>
<rect x="90" y="470" width="170" height="95" rx="7" fill="#FDF3E2" stroke="#B06A00" stroke-width="2"/>
<text x="175.0" y="498.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">Learner model</text>
<text x="175.0" y="517.0" text-anchor="middle" font-size="11" fill="#45505C">max level, max hours,</text>
<text x="175.0" y="532.0" text-anchor="middle" font-size="11" fill="#45505C">topics to avoid,</text>
<text x="175.0" y="547.0" text-anchor="middle" font-size="11" fill="#45505C">beliefs in prose</text>
<rect x="340" y="340" width="190" height="110" rx="7" fill="#E9ECFA" stroke="#3A4A9F" stroke-width="2"/>
<text x="435.0" y="375.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">Preference learning</text>
<text x="435.0" y="394.5" text-anchor="middle" font-size="11" fill="#45505C">Bradley–Terry fit</text>
<text x="435.0" y="409.5" text-anchor="middle" font-size="11" fill="#45505C">never sees a reward value,</text>
<text x="435.0" y="424.5" text-anchor="middle" font-size="11" fill="#45505C">only which plan won</text>
<rect x="600" y="340" width="180" height="110" rx="7" fill="#F5F7F9" stroke="#7D8B99" stroke-width="1.4"/>
<text x="690.0" y="375.5" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1A1F26">Accepted feedback</text>
<text x="690.0" y="394.5" text-anchor="middle" font-size="11" fill="#45505C">becomes pairwise</text>
<text x="690.0" y="409.5" text-anchor="middle" font-size="11" fill="#45505C">comparisons: plan A</text>
<text x="690.0" y="424.5" text-anchor="middle" font-size="11" fill="#45505C">preferred over plan B</text>
<rect x="860" y="340" width="200" height="110" rx="7" fill="#FDF3E2" stroke="#B06A00" stroke-width="2"/>
<text x="960.0" y="375.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">Feedback Agent  (LangGraph)</text>
<text x="960.0" y="394.5" text-anchor="middle" font-size="11" fill="#45505C">Is this credible? actionable?</text>
<text x="960.0" y="409.5" text-anchor="middle" font-size="11" fill="#45505C">Does it contradict what</text>
<text x="960.0" y="424.5" text-anchor="middle" font-size="11" fill="#45505C">they said before?  temp 0.7</text>
<rect x="1130" y="350" width="150" height="80" rx="7" fill="#F5F7F9" stroke="#7D8B99" stroke-width="1.4"/>
<text x="1205.0" y="378.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1A1F26">Learner reacts</text>
<text x="1205.0" y="397.0" text-anchor="middle" font-size="11" fill="#45505C">thumbs up / down</text>
<text x="1205.0" y="412.0" text-anchor="middle" font-size="11" fill="#45505C">+ a reason in words</text>
<rect x="880" y="480" width="160" height="60" rx="7" fill="#E9F5EE" stroke="#0D6158" stroke-width="1.4"/>
<text x="960.0" y="498.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">ACT</text>
<text x="960.0" y="517.0" text-anchor="middle" font-size="11" fill="#45505C">interpret, update</text>
<text x="960.0" y="532.0" text-anchor="middle" font-size="11" fill="#45505C">the learner model</text>
<rect x="1070" y="480" width="150" height="60" rx="7" fill="#FBEAE5" stroke="#A33A22" stroke-width="1.4"/>
<text x="1145.0" y="498.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">CLARIFY</text>
<text x="1145.0" y="517.0" text-anchor="middle" font-size="11" fill="#45505C">ask one question,</text>
<text x="1145.0" y="532.0" text-anchor="middle" font-size="11" fill="#45505C">change nothing yet</text>
<rect x="1240" y="480" width="110" height="60" rx="7" fill="#EEF1F4" stroke="#7D8B99" stroke-width="1.4"/>
<text x="1295.0" y="498.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">RECORD</text>
<text x="1295.0" y="517.0" text-anchor="middle" font-size="11" fill="#45505C">log it, no</text>
<text x="1295.0" y="532.0" text-anchor="middle" font-size="11" fill="#45505C">policy change</text>
<rect x="40" y="630" width="1320" height="130" rx="9" fill="none" stroke="#0D6158" stroke-width="1.2" stroke-dasharray="7 5" opacity="0.8"/>
<text x="54" y="649" font-size="11" font-weight="600" fill="#0D6158" letter-spacing="0.4">FROZEN  —  read by retrieval and by the reward; built once, hashed, replayable with no API call</text>
<rect x="90" y="665" width="180" height="70" rx="7" fill="#E3F1EF" stroke="#0D6158" stroke-width="1.4"/>
<text x="180.0" y="688.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">Course catalog</text>
<text x="180.0" y="707.0" text-anchor="middle" font-size="11" fill="#45505C">1,899 courses</text>
<text x="180.0" y="722.0" text-anchor="middle" font-size="11" fill="#45505C">188 skills, 15 families</text>
<rect x="330" y="665" width="180" height="70" rx="7" fill="#E3F1EF" stroke="#0D6158" stroke-width="1.4"/>
<text x="420.0" y="688.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">Prerequisite graph</text>
<text x="420.0" y="707.0" text-anchor="middle" font-size="11" fill="#45505C">254 edges</text>
<text x="420.0" y="722.0" text-anchor="middle" font-size="11" fill="#45505C">→ 122 study plans</text>
<rect x="570" y="665" width="180" height="70" rx="7" fill="#E3F1EF" stroke="#0D6158" stroke-width="1.4"/>
<text x="660.0" y="688.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">Simulated learners</text>
<text x="660.0" y="707.0" text-anchor="middle" font-size="11" fill="#45505C">500 personas</text>
<text x="660.0" y="722.0" text-anchor="middle" font-size="11" fill="#45505C">goal, level, hours</text>
<rect x="810" y="665" width="180" height="70" rx="7" fill="#E3F1EF" stroke="#0D6158" stroke-width="1.4"/>
<text x="900.0" y="688.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">Reward spec</text>
<text x="900.0" y="707.0" text-anchor="middle" font-size="11" fill="#45505C">frozen + hashed</text>
<text x="900.0" y="722.0" text-anchor="middle" font-size="11" fill="#45505C">before any run</text>
<rect x="1050" y="660" width="260" height="80" rx="7" fill="#FBEAE5" stroke="#A33A22" stroke-width="1.4"/>
<text x="1180.0" y="688.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1A1F26">Firewall</text>
<text x="1180.0" y="707.0" text-anchor="middle" font-size="11" fill="#45505C">the recommender never reads the prerequisite</text>
<text x="1180.0" y="722.0" text-anchor="middle" font-size="11" fill="#45505C">graph, the reward spec, or hidden state</text>
<path d="M210,175 L260,175" fill="none" stroke="#5A6572" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M410,175 L460,175" fill="none" stroke="#5A6572" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M640,175 L690,175" fill="none" stroke="#5A6572" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M860,175 L910,175" fill="none" stroke="#5A6572" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M1070,175 L1130,175" fill="none" stroke="#5A6572" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M1205,215 L1205,350" fill="none" stroke="#5A6572" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M1130,390 L1060,390" fill="none" stroke="#5A6572" stroke-width="1.5" marker-end="url(#ag)"/>
<path d="M960,450 L960,480" fill="none" stroke="#5A6572" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<path d="M1060,400 L1145,400 L1145,480" fill="none" stroke="#5A6572" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<path d="M1060,430 L1295,430 L1295,480" fill="none" stroke="#5A6572" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<path d="M880,510 L690,510 L690,450" fill="none" stroke="#0D6158" stroke-width="2.2" marker-end="url(#at)"/>
<text x="752" y="528" font-size="10.5" text-anchor="middle" fill="#0D6158" font-weight="500">only the ACT branch reaches the model</text>
<path d="M960,540 L960,588 L175,588 L175,565" fill="none" stroke="#B06A00" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ao)"/>
<path d="M600,395 L530,395" fill="none" stroke="#3A4A9F" stroke-width="1.5" marker-end="url(#ab)"/>
<path d="M435,340 L435,280 L660,280 L660,175 L690,175" fill="none" stroke="#3A4A9F" stroke-width="2.6" marker-end="url(#ab)"/>
<text x="548" y="272" font-size="10.5" text-anchor="middle" fill="#3A4A9F" font-weight="500">retrains the scorer</text>
<path d="M90,517 L56,517 L56,175 L70,175" fill="none" stroke="#B06A00" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ao)"/>
<text x="66" y="283" font-size="10.5" text-anchor="start" fill="#B06A00" font-weight="500">constrains the next query</text>
<text x="40" y="792" font-size="11" fill="#5A6572"><tspan font-weight="600">Legend</tspan>   </text>
<rect x="112" y="781" width="14" height="14" rx="3" fill="#FDF3E2" stroke="#B06A00" stroke-width="1.6"/>
<text x="133" y="792" font-size="11" fill="#5A6572">LLM agent — makes a judgement</text>
<rect x="380" y="781" width="14" height="14" rx="3" fill="#E9ECFA" stroke="#3A4A9F" stroke-width="1.6"/>
<text x="401" y="792" font-size="11" fill="#5A6572">learned from feedback</text>
<rect x="600" y="781" width="14" height="14" rx="3" fill="#E3F1EF" stroke="#0D6158" stroke-width="1.6"/>
<text x="621" y="792" font-size="11" fill="#5A6572">frozen artifact</text>
<rect x="770" y="781" width="14" height="14" rx="3" fill="#F5F7F9" stroke="#7D8B99" stroke-width="1.6"/>
<text x="791" y="792" font-size="11" fill="#5A6572">plain step</text>
<text x="900" y="792" font-size="11" fill="#5A6572">dashed = a branch the agent chooses, or a soft constraint</text>
</svg>