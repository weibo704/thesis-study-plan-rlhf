rationale:
  w_topic: The learner's stated goal is the primary signal. Scaled so topic contributes
    ~29% of total reward spread across the pool.
  w_too_hard: "A one-level overshoot costs 0.45 \u2014 as much as the ENTIRE topic\
    \ range. Being pushed past your depth should outweigh a better topic match, which\
    \ is the sequencing behaviour under study."
  w_too_easy: Boredom is real but milder than frustration. Set to one third of w_too_hard
    (3:1), keeping the term asymmetric; a symmetric penalty would make the optimal
    policy level-neutral and erase sequencing.
  w_time: Over-budget is penalised but capped at 2x the learner's budget. At the earlier
    3x clip time became the single largest term, ahead of both topic and difficulty.
  w_quality: Ratings are a selection-biased popularity signal, not per-user utility,
    so the contribution is clipped to [-0.15, +0.10]. Uncapped, 1-star outliers spanned
    as much reward as the whole topic range.
  w_unknown_penalty: A small cost per missing field so a course with no level and
    no duration cannot win on silence. Kept to ~6% of spread.
  w_goal: Overlap with skills the learner still LACKS from their stated goal. Absent
    in poc-v1, which scored only present-tense fit. The bandit learned +0.006 on that
    feature -- correct, since nothing credited it -- and so ignored goal progress,
    ending at 0.25 against the baseline's 0.45 while earning MORE reward. Added because
    the reward omitted the stated objective; this is a specification gap, not weight-tuning
    to favour a policy.
